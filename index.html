<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 번역기</title>
  <meta name="description" content="영어 PDF를 올리면 한국어로 번역해 주는 사이트">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5bd3'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>가</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>PDF 번역기</h1>
      <p class="tagline">영어 PDF를 올리면 한국어로 번역해 드려요. 파일은 내 브라우저 안에서만 읽어요.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card controls" aria-labelledby="step-engine">
      <h2 id="step-engine"><span class="step">1</span> 번역 방식</h2>
      <label class="field">
        <span class="field-label">번역 엔진</span>
        <select id="provider"></select>
      </label>
      <p id="provider-desc" class="muted"></p>
      <p id="provider-availability" class="note" hidden></p>
      <div id="provider-fields" class="fields"></div>
      <label id="remember-wrap" class="check" hidden>
        <input type="checkbox" id="remember-secrets">
        <span>API 키를 이 브라우저에 저장 (공용 컴퓨터에서는 끄세요)</span>
      </label>
    </section>

    <section class="card controls" aria-labelledby="step-file">
      <h2 id="step-file"><span class="step">2</span> PDF 파일</h2>
      <label id="dropzone" class="dropzone">
        <input type="file" id="file-input" accept="application/pdf,.pdf">
        <span class="dropzone-main">PDF 파일을 끌어다 놓거나 눌러서 고르세요</span>
        <span id="file-name" class="dropzone-file muted">선택한 파일 없음</span>
      </label>

      <div class="actions">
        <button type="button" id="start" class="primary" disabled>번역 시작</button>
        <button type="button" id="resume" hidden>남은 부분 이어서 번역</button>
        <button type="button" id="stop" class="danger" hidden>중지</button>
      </div>

      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="번역 진행률">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results-section" class="results-section" hidden aria-labelledby="results-title">
      <div class="results-toolbar">
        <h2 id="results-title">번역 결과</h2>
        <div class="toolbar-actions">
          <label class="check">
            <input type="checkbox" id="show-source">
            <span>원문 함께 보기</span>
          </label>
          <button type="button" id="download-txt">번역문 저장 (.txt)</button>
          <button type="button" id="download-md">원문+번역 저장 (.md)</button>
          <button type="button" id="print">인쇄 / PDF로 저장</button>
        </div>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <footer class="site-footer wrap muted">
    <p>무료 엔진은 사용량 제한이 있을 수 있어요. 표·수식·그림 배치는 그대로 옮겨지지 않고 글자만 번역돼요. 스캔한 이미지 PDF는 아직 지원하지 않아요.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
